# Baza Empire — LiteLLM Cloud Proxy Config
# Exposes all cloud models through a single OpenAI-compatible API on port 4000
# Agents access via: http://localhost:4000/v1
# Auth header: Authorization: Bearer baza-litellm (internal only)

general_settings:
  master_key: "baza-litellm-internal"
  completion_model: "gemini-2-flash"
  drop_params: true
  max_budget: 50.0
  budget_duration: "30d"

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 0
  request_timeout: 60
  fallbacks:
    - gemini-2-flash: ["gemini-flash-2-lite", "local/qwen2.5-14b"]
    - gemini-flash-2-lite: ["local/qwen2.5-14b"]
    - gemini-pro-1.5: ["gemini-2-flash", "local/qwen2.5-14b"]
    - gpt-4o: ["gemini-2-flash", "local/qwen2.5-14b"]
    - claude-3-5-sonnet: ["gemini-2-flash", "local/qwen2.5-14b"]
    - claude-opus: ["gemini-2-flash", "local/qwen2.5-14b"]

# ── Cloud Models ───────────────────────────────────────────────────────────────
model_list:

  # ── OpenAI ──────────────────────────────────────────────────────────────────
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: gpt-4-turbo
    litellm_params:
      model: openai/gpt-4-turbo
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: o1

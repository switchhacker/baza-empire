<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baza Cloud — Login</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#07070f;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    body::before{content:'';position:fixed;inset:0;background:
      radial-gradient(ellipse 600px 400px at 20% 30%,rgba(124,58,237,.06),transparent),
      radial-gradient(ellipse 500px 500px at 80% 70%,rgba(233,69,96,.05),transparent);
      pointer-events:none;z-index:0}
    body::after{content:'';position:fixed;inset:0;background:
      repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(255,255,255,.008) 40px,rgba(255,255,255,.008) 41px),
      repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(255,255,255,.008) 40px,rgba(255,255,255,.008) 41px);
      pointer-events:none;z-index:0}

    .login-card{position:relative;z-index:1;width:100%;max-width:420px;background:#0e0e1e;border:1px solid #1a1a2e;border-radius:16px;padding:40px 36px 36px;box-shadow:0 8px 40px rgba(0,0,0,.5),0 0 80px rgba(124,58,237,.06)}

    .brand{text-align:center;margin-bottom:32px}
    .brand-icon{font-size:36px;margin-bottom:8px;display:block}
    .brand-title{font-size:26px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#e94560,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .brand-sub{font-size:13px;color:#555;margin-top:6px;letter-spacing:1px}

    .tabs{display:flex;border-bottom:1px solid #1a1a2e;margin-bottom:28px}
    .tab{flex:1;text-align:center;padding:12px 0;font-size:13px;font-weight:700;color:#555;cursor:pointer;border-bottom:3px solid transparent;transition:color .2s,border-color .2s;letter-spacing:.5px;text-transform:uppercase}
    .tab:hover{color:#999}
    .tab.active{color:#e0e0e0;border-bottom-color:#e94560}

    .form{display:none}
    .form.active{display:block}

    .field{margin-bottom:18px}
    .field label{display:block;font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .field input{width:100%;background:#111;border:1px solid #1a1a2e;border-radius:8px;padding:12px 14px;color:#e0e0e0;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
    .field input:focus{border-color:#7c3aed}
    .field input::placeholder{color:#333}

    .btn-submit{width:100%;padding:14px;border:none;border-radius:8px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:.5px;background:linear-gradient(135deg,#e94560,#7c3aed);transition:opacity .2s,transform .1s;margin-top:6px}
    .btn-submit:hover{opacity:.9;transform:translateY(-1px)}
    .btn-submit:active{transform:translateY(0)}
    .btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none}

    .error-msg{background:#2a0d0d;border:1px solid #5a1a1a;color:#ff6666;font-size:12px;padding:10px 14px;border-radius:8px;margin-bottom:16px;display:none;text-align:center}
    .error-msg.visible{display:block}

    .note{text-align:center;font-size:11px;color:#444;margin-top:14px}
    .note span{color:#00d084;font-weight:700}

    .footer{text-align:center;margin-top:24px;font-size:11px;color:#222}
  </style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <span class="brand-icon">&#9889;</span>
    <div class="brand-title">BAZA CLOUD</div>
    <div class="brand-sub">Multi-Agent Cloud Platform</div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">Login</div>
    <div class="tab" onclick="switchTab('register')">Register</div>
  </div>

  <!-- Login Form -->
  <div class="form active" id="form-login">
    <div class="error-msg" id="login-error"></div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password">
    </div>
    <button class="btn-submit" onclick="loginUser()" id="btn-login">Sign In</button>
  </div>

  <!-- Register Form -->
  <div class="form" id="form-register">
    <div class="error-msg" id="register-error"></div>
    <div class="field">
      <label>Display Name</label>
      <input type="text" id="reg-name" placeholder="Your name" autocomplete="name">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="reg-password" placeholder="Create password" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="reg-confirm" placeholder="Confirm password" autocomplete="new-password">
    </div>
    <button class="btn-submit" onclick="registerUser()" id="btn-register">Create Account</button>
    <div class="note"><span>200 GB</span> cloud storage included with every account</div>
  </div>

  <div class="footer">Baza Empire &copy; 2026</div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1));
  });
  document.getElementById('form-login').classList.toggle('active', tab === 'login');
  document.getElementById('form-register').classList.toggle('active', tab === 'register');
  hideErrors();
}

function hideErrors() {
  document.querySelectorAll('.error-msg').forEach(e => { e.classList.remove('visible'); e.textContent = ''; });
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('visible');
}

async function loginUser() {
  hideErrors();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  if (!email || !password) {
    showError('login-error', 'Please enter both email and password.');
    return;
  }

  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try {
    const res = await fetch('/api/cloud/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (res.ok && data.success) {
      window.location.href = '/cloud';
    } else {
      showError('login-error', data.error || 'Invalid email or password.');
    }
  } catch (err) {
    showError('login-error', 'Connection error. Please try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

async function registerUser() {
  hideErrors();
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const confirm = document.getElementById('reg-confirm').value;

  if (!name || !email || !password || !confirm) {
    showError('register-error', 'All fields are required.');
    return;
  }
  if (password.length < 8) {
    showError('register-error', 'Password must be at least 8 characters.');
    return;
  }
  if (password !== confirm) {
    showError('register-error', 'Passwords do not match.');
    return;
  }

  const btn = document.getElementById('btn-register');
  btn.disabled = true;
  btn.textContent = 'Creating account...';

  try {
    const res = await fetch('/api/cloud/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({display_name: name, email, password})
    });
    const data = await res.json();
    if (res.ok && data.success) {
      window.location.href = '/cloud';
    } else {
      showError('register-error', data.error || 'Registration failed.');
    }
  } catch (err) {
    showError('register-error', 'Connection error. Please try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }
}

// Allow Enter key to submit
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('form-login').classList.contains('active')) loginUser();
    else registerUser();
  }
});
</script>

</body>
</html>
